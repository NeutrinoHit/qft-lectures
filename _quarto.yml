project:
  type: website
  output-dir: _site
  resources:
    - "assets/**"
    - "shared/reveal/**"
    - "unruh/ru/slides/assets/**"
    - "en/slides/media/**"
  render:
    - "*.qmd"
    - "unruh/index.qmd"
    - "unruh/ru/slides/*.qmd"
    - "en/slides/*.qmd"

lang: ru-RU

website:
  title: "Квантовая теория поля"
  site-url: "https://neutrinohit.github.io/qft-lectures/"
  repo-url: "https://github.com/NeutrinoHit/qft-lectures"
  navbar:
    left:
      - href: https://neutrinohit.github.io/
        text: NeutrinoHit
      - href: https://neutrinohit.github.io/ru/education.html#qft
        text: Карта КТП
      - href: index.qmd
        text: Раздел КТП
      - href: unruh/index.qmd
        text: Эффект Унру
  page-footer:
    left: "© NeutrinoHit"
    right: "Built with Quarto"

format:
  html:
    theme: cosmo
    css:
      - https://neutrinohit.github.io/assets/site/neutrinohit-tokens.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-base.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-components.css
      - https://neutrinohit.github.io/assets/site/neutrinohit-projects.css
      - styles.css
    toc: false
    page-layout: full
    include-after-body: analytics/cloudflare-web-analytics.html
